name: Build and Lint

on:
  push:
    # Run on pushes to branches only. Tag pushes are excluded because
    # release.yml fires on `v*` tags and already runs lint + build
    # before publishing — duplicating that here is wasted CI minutes.
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Match engines.node in package.json (^22.12.0 || ^24.0.0).
        # Homebridge 2 itself requires Node 22+, so older versions would
        # fail at `npm install` anyway.
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        # Locked tree (package-lock.json committed as of PR A).
        run: npm ci

      - name: Lint the project
        run: npm run lint

      - name: Run tests
        # Vitest suite. Runs against the source tree (not dist/) so no
        # build is required first. Tests are non-blocking on release
        # for now — see the corresponding note in release.yml. Once
        # the suite has proven stable across a few releases, add
        # `npm test` to prepublishOnly so a broken suite fails npm publish.
        run: npm test

      - name: Build the project
        run: npm run build

      - name: List, audit, fix outdated dependencies and build again
        run: |
          npm list --outdated
          npm audit || true  # ignore failures
          npm audit fix || true
          npm list --outdated
          npm run build

  # The CANONICAL producer of the committed Angular editor artifacts
  # (homebridge-ui/public/app/, GA task #69 / §10.1): exactly Node
  # 22.13, matching the Volta pin in package.json. (Not 22.12: the
  # engines floor is untestable there — @matter/nodejs, an optional
  # dependency of Homebridge 2.x, excludes >=22.0.0 <22.13.0, so npm
  # silently skips it and the Homebridge import chain breaks.) Two cold builds must
  # be byte-identical AND match the committed files, and the committed
  # index.html asset references must be current. Contributors on other
  # Node versions get caught here if their local rebuild drifted.
  ui-app-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22.13 (canonical artifact producer)
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'

      - name: Install dependencies
        run: npm ci

      - name: Verify committed UI artifacts are deterministic and current
        run: npm run verify:app

      - name: Verify the rebuild left the working tree clean
        run: git diff --exit-code
