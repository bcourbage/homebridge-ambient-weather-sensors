name: Build and Lint

on:
  push:
    # Run on pushes to branches only. Tag pushes are excluded because
    # release.yml fires on `v*` tags and already runs lint + build
    # before publishing — duplicating that here is wasted CI minutes.
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Match engines.node in package.json (^22.13.0 || ^24.0.0).
        # '22.13' is the EXACT declared floor — 22.x continually moves
        # above it and would never prove the floor actually works (the
        # beta.11 release failed on 22.12 because @matter/nodejs, an
        # optional Homebridge 2 dependency, excludes >=22.0.0 <22.13.0).
        node-version: ['22.13', 22.x, 24.x]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        # Locked tree (package-lock.json committed as of PR A).
        run: npm ci

      - name: Lint the project
        run: npm run lint

      - name: Build the project
        run: npm run build

      - name: Verify committed runtime artifacts match the build
        # Integration suites import these files, not just TypeScript source.
        # A stale committed build must fail before those suites run.
        run: |
          git diff --exit-code
          artifacts=$(git status --porcelain --untracked-files=all -- dist homebridge-ui)
          if [ -n "$artifacts" ]; then
            printf '%s\n' "$artifacts"
            exit 1
          fi

      - name: Run tests against the rebuilt artifact
        run: npm test

      - name: Verify a production-only install of the packed artifact
        run: npm run verify:package

      - name: Audit production dependencies (read-only)
        # Never mutate the locked dependency tree after testing it.
        run: npm audit --omit=dev
        continue-on-error: true

  # The CANONICAL producer of the committed Angular editor artifacts
  # (homebridge-ui/public/app/, GA task #69 / §10.1): exactly Node
  # 22.13, matching the Volta pin in package.json. (Not 22.12: the
  # engines floor is untestable there — @matter/nodejs, an optional
  # dependency of Homebridge 2.x, excludes >=22.0.0 <22.13.0, so npm
  # silently skips it and the Homebridge import chain breaks.) Two cold builds must
  # be byte-identical AND match the committed files, and the committed
  # index.html asset references must be current. Contributors on other
  # Node versions get caught here if their local rebuild drifted.
  ui-app-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22.13 (canonical artifact producer)
        uses: actions/setup-node@v6
        with:
          node-version: '22.13'

      - name: Install dependencies
        run: npm ci

      - name: Verify committed UI artifacts are deterministic and current
        run: npm run verify:app

      - name: Verify the rebuild left the working tree clean
        run: |
          git diff --exit-code
          artifacts=$(git status --porcelain --untracked-files=all -- dist homebridge-ui)
          if [ -n "$artifacts" ]; then
            printf '%s\n' "$artifacts"
            exit 1
          fi
