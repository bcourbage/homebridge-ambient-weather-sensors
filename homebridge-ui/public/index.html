<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ambient Weather Sensors</title>
  <style>
    /*
     * Theme cooperation with HB UI X (task #69 follow-up): the parent
     * injects its OWN theme stylesheet into this iframe (ui.js applies
     * parent-sent inline-style / link-element messages) and adds a
     * `dark-mode` class to <body> when its theme is dark. Two rules
     * keep our panels legible in both themes regardless of injected-
     * sheet cascade order:
     *   1. Everything we style is scoped under #awn — id specificity
     *      beats the injected theme's class/element rules even though
     *      that sheet loads after ours.
     *   2. Every rule pairs background AND text color from the same
     *      palette (CSS variables below), so no element ever renders
     *      half ours / half theirs.
     *   3. HB UI X additionally injects the LOAD-TIME theme's body
     *      colors as an !important inline style it never re-sends, so
     *      a live theme switch left the page ground frozen at the old
     *      theme while our panels followed. The two body rules after
     *      the palette definitions out-rank it (class > element
     *      specificity, both !important) and key on the live-mirrored
     *      theme classes; the color values are HB UI X's own.
     */
    #awn {
      --fg: #1a1a1a; --fg-sub: #666; --fg-empty: #6e6e6e;
      --rule: #ddd; --row-rule: #eee;
      --panel-bg: #f7f7f7; --code-bg: #f0f0f0;
      --warn-bg: #fff8e1;  --warn-fg: #5f4a00;  --warn-edge: #f0b000;
      --error-bg: #fdecea; --error-fg: #8c1d18; --error-edge: #c62828;
      --info-bg: #e3f2fd;  --info-fg: #0d47a1;  --info-edge: #1976d2;
      --on-bg: #c8e6c9;    --on-fg: #1b5e20;
      --off-bg: #ffcdd2;   --off-fg: #b71c1c;
      --btn-bg: #fff; --btn-fg: #1a1a1a; --btn-edge: #bbb; --btn-hover: #f0f0f0;
      --page-bg: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      /* Pinned: the host mirrors its stylesheets into this iframe, so
         inherited line metrics depend on the HB UI X version. */
      line-height: 1.45;
      color: var(--fg);
    }
    body.dark-mode #awn {
      --fg: #e8eaed; --fg-sub: #9aa0a6; --fg-empty: #9aa0a6;
      --rule: #4a4d51; --row-rule: #3c4043;
      --panel-bg: #2d2f33; --code-bg: #3c4043;
      --warn-bg: #3d3000;  --warn-fg: #ffd54f;  --warn-edge: #f0b000;
      --error-bg: #4a1210; --error-fg: #f4a9a3; --error-edge: #e57373;
      --info-bg: #102a43;  --info-fg: #90caf9;  --info-edge: #42a5f5;
      --on-bg: #1e3b21;    --on-fg: #a5d6a7;
      --off-bg: #4a1a1a;   --off-fg: #ef9a9a;
      --btn-bg: #2d2f33; --btn-fg: #e8eaed; --btn-edge: #5f6368; --btn-hover: #3c4043;
      --page-bg: #242424;
    }
    body { margin: 0; padding: 16px; }
    /* Header point 3: keep the page ground on the LIVE theme. */
    body.dark-mode { background-color: #242424 !important; color: #FFFFFF !important; }
    body:not(.dark-mode) { background-color: #FFFFFF !important; color: #000000 !important; }
    #awn h1   { font-size: 1.25rem; margin: 24px 0 4px 0; color: var(--fg); }
    #awn h2   { font-size: 1.05rem; margin: 20px 0 6px 0; border-bottom: 1px solid var(--rule); padding-bottom: 4px; color: var(--fg); }
    /* Subordinate headings inside a section (Bruno's beta.11 feedback:
       all-h2 made "Sensor map" look like an empty sibling section). */
    #awn h3   { font-size: 0.95rem; margin: 16px 0 4px 0; color: var(--fg); }
    #awn .sub { color: var(--fg-sub); font-size: 0.9rem; margin-bottom: 12px; }
    #awn .page-footer { margin-top: 20px; }
    #awn .page-footer a { color: var(--info-fg); }
    #awn .banner {
      padding: 10px 14px; border-radius: 6px; margin: 12px 0; font-size: 0.92rem;
      background: var(--warn-bg); color: var(--warn-fg); border-left: 4px solid var(--warn-edge);
    }
    #awn .banner.safe-mode { background: var(--error-bg); color: var(--error-fg); border-left-color: var(--error-edge); }
    #awn .banner.info      { background: var(--info-bg);  color: var(--info-fg);  border-left-color: var(--info-edge); }
    #awn .flag {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
    }
    #awn .flag.on  { background: var(--on-bg);  color: var(--on-fg); }
    #awn .flag.off { background: var(--off-bg); color: var(--off-fg); }
    #awn .flag-source { margin-left: 8px; color: var(--fg-sub); }
    #awn table  { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
    #awn th, #awn td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--row-rule); color: var(--fg); }
    #awn th     { background: var(--panel-bg); font-weight: 600; }
    #awn .empty { color: var(--fg-empty); font-style: italic; padding: 8px 0; }
    #awn button {
      padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.88rem;
      background: var(--btn-bg); color: var(--btn-fg); border: 1px solid var(--btn-edge);
      /* The host's mirrored reset sets button text-align to inherit,
         which left-aligns labels inside width-stretched cells. */
      text-align: center;
    }
    #awn button:hover { background: var(--btn-hover); }
    /* Disabled must LOOK disabled (beta.17 RC smoke): the buttons are
       custom-styled, so the browser's default disabled look never
       applies. */
    #awn button:disabled { opacity: 0.45; cursor: default; }
    #awn button:disabled:hover { background: var(--btn-bg); }
    /* Not named ".row": HB UI X mirrors its stylesheets (Bootstrap
       included) into this iframe, and Bootstrap's grid ".row"/".row > *"
       rules would fight this layout. Class names here must stay out
       of Bootstrap's namespace (see bootstrapNamespace.test.ts). */
    #awn .title-row { display: flex; align-items: center; gap: 8px; }
    #awn .grow { flex: 1; }
    #awn code { background: var(--code-bg); color: var(--fg); padding: 1px 4px; border-radius: 3px; font-size: 0.85em; }
  </style>
</head>
<body>
  <!--
    The schema form is never rendered (beta.17): every editable
    setting lives in the app below, and rendering the form would
    recreate the second-writer hazard the guarded save prevents.
  -->

  <div id="awn">
    <!--
      The Angular sensor-map editor (#69) bootstraps onto this element.
      Since beta.17 (GA #56/#65) it is the WHOLE settings page: the
      preview-era chrome (status table, discovered-datapoints dump,
      notices panel) and the schema form are gone; connection settings
      live inside the app, and the ONLY functional save path is the
      app's own guarded Save. The bundle is committed under app/ with
      content-hashed filenames; the script reference between the
      markers below is REWRITTEN by scripts/update-ui-fragment.mjs
      after every `npm run build:app` — never edit that block by hand.
    -->
    <awn-root></awn-root>

    <p class="sub page-footer">
      Save changes with the Save button on this page. The Homebridge Save button below is disabled by design; the Homebridge UI offers no way to hide it.
    </p>
    <p class="sub page-footer">
      <a href="https://github.com/sponsors/bcourbage" target="_blank" rel="noopener">Sponsor this plugin on GitHub</a>
    </p>
  </div>
  <!-- awn-app:assets:begin -->
  <script type="module" src="app/main-6XQW7GY5.js"></script>
  <!-- awn-app:assets:end -->

  <script>
    // homebridge is injected into window by Homebridge UI X.
    /* global homebridge */

    // THE FIRST STATEMENT, synchronous, before any asynchronous
    // initialization (beta.17 requirement): the native footer Save is
    // never a save path for this plugin. In custom UI mode HB UI X
    // ships it disabled and this page never calls enableSaveButton();
    // the explicit disable below is the defensive belt in case a host
    // version changes the default. The page's own guarded Save is the
    // only functional save path. (HB UI X's SDK has no call to HIDE
    // the button — tracked upstream; see the note in the page footer.)
    try {
      homebridge.disableSaveButton();
    } catch (e) {
      // eslint-disable-next-line no-console
      console.warn('[awn-ui] disableSaveButton unavailable', e);
    }

    // The schema form is never shown (beta.17): every editable setting
    // lives in the app, and rendering the form would recreate the
    // second-writer hazard the guarded save exists to prevent.

    // The settings modal's header buttons carry title attributes
    // ("Plugin Config" etc.), and the browser's native tooltip for
    // them floats over this page's content (beta.17 RC smoke). Each
    // one duplicates its text in an aria-label, so dropping the title
    // loses nothing for assistive tech. The iframe is same-origin
    // with the host page; if a host version changes that, the sweep
    // does nothing.
    function dropParentTitleTooltips() {
      try {
        var pdoc = window.parent.document;
        var modal = pdoc.querySelector('.modal');
        if (!modal) {
          return;
        }
        modal.querySelectorAll('[title]').forEach(function (el) {
          // Only when a NON-EMPTY aria-label replaces it: removing a
          // title that is an element's only explanation would cost
          // its hover help and accessible name (review P2-4).
          var label = el.getAttribute('aria-label');
          if (typeof label === 'string' && label.trim() !== '') {
            el.removeAttribute('title');
          }
        });
      } catch (e) { /* cross-origin or standalone: nothing to sweep */ }
    }
    dropParentTitleTooltips();
    // The modal header finishes rendering after this iframe loads, and
    // a host language switch can re-apply the attribute.
    setTimeout(dropParentTitleTooltips, 1000);
    window.addEventListener('focus', dropParentTitleTooltips);
  </script>
</body>
</html>
